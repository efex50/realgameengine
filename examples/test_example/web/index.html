        canvas { width: 100%; height: 100%; display: block; }
    </style>

        import init, { send_message , zort } from "./pkg/test_example.js";

        function setup(){
            let store = document.querySelector("#store");

            // 'maximum: 65536' değeri Rust config'indeki 4GB sınırına denk gelir.
            const memory = new WebAssembly.Memory({
                initial: 20,
                maximum: 65536,
                shared: true
            });

            // İlk parametre module path (undefined bırakırsak varsayılanı kullanır)

            await init(undefined, memory);
